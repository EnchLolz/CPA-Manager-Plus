name: Personal image

# Personal fork only. Builds the manager-server image for tags shaped like
# ench-v<upstream>-<n> (for example ench-v1.14.2-1). The prefix keeps these
# tags out of upstream's release workflow, which only matches v*.

on:
  push:
    tags:
      - 'ench-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (defaults to the personal branch)'
        required: false
        default: personal

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cpa-manager-plus

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/ench-v* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            base="$(git describe --tags --abbrev=0 --match 'v*' HEAD)"
            version="ench-${base}-dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "lower_image=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.manager-server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.version.outputs.lower_image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.lower_image }}:personal
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SOURCE_COMMIT=${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
