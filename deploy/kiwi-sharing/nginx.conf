worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        # Only tailscaled on this host can reach the public-facing listener.
        listen 127.0.0.1:18448;
        server_name _;
        client_max_body_size 16m;
        client_header_timeout 15s;
        client_body_timeout 30s;

        location ~ ^/share/v1/(models|chat/completions|responses|messages)$ {
            proxy_pass http://100.79.242.61:18317;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 920s;
            proxy_send_timeout 920s;
        }

        # The panel, management API, and ordinary CPA routes stay private.
        location / { return 404; }
    }
}
